<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visor EPUB — Vida y rutinas</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, Arial, sans-serif; }
    body { display: flex; flex-direction: column; }
    .toolbar { background: #222; color: #fff; display: flex; align-items: center; gap: 12px; padding: 0 12px; height: 44px; }
    .toolbar a { color: #fff; text-decoration: none; }
    #viewer { flex: 1; min-height: 0; }
    .fallback { padding: 1rem; }
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="../documento_resumen_03.md">← Volver</a>
    <span>Visor EPUB — Vida y rutinas</span>
  </div>
  <div id="viewer"></div>
  <div class="fallback" id="fallback" style="display:none">
    <p>No se pudo cargar el visor EPUB. Puedes descargarlo <a href="dist/milibro.epub">aquí</a>.</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
  <script>
    const epubPath = 'dist/milibro.epub';
    const viewer = document.getElementById('viewer');
    const fallback = document.getElementById('fallback');
    try {
      const book = ePub(epubPath);
      const rendition = book.renderTo('viewer', { width: '100%', height: '100%' });
      rendition.themes.default({ '::selection': { 'background': 'rgba(255, 214, 10, 0.3)' } });
      rendition.display();
      book.ready.catch(() => {
        viewer.style.display = 'none';
        fallback.style.display = 'block';
      });
    } catch (error) {
      viewer.style.display = 'none';
      fallback.style.display = 'block';
    }
  </script>
</body>
</html>
